app = "gplayapiv2"
primary_region = "sin"

[build]

[http_service]
  protocol = "tcp"
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  soft_limit = 800
  hard_limit = 1000

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[env]
  COUNTRY_OF_QUERY = "IN"
  LOGGING = true
  RATE_LIMIT_DISABLED = true

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
