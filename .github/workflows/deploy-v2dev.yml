name: Deploy v2 verification

on:
  push:
    branches:
      - v2dev
  pull_request:
    branches:
      - v2dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:v2dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate OpenAPI document
        run: npm run generateoas

      - name: Run API tests
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2dev'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2dev
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy gplayapiv2
        run: flyctl deploy --config fly.v2dev.toml --image ${{ env.IMAGE }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
